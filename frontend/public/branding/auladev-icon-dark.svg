<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  
  <!-- Main mark: Abstract "A" formed by code brackets + upward arrow (learning/growth) -->
  <g fill="none" stroke="url(#grad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left bracket / left leg of A -->
    <path d="M 120 380 L 256 120" opacity="0.9"/>
    <!-- Right bracket / right leg of A -->
    <path d="M 392 380 L 256 120" opacity="0.9"/>
    <!-- Crossbar — also reads as code dash/minus -->
    <line x1="155" y1="290" x2="357" y2="290" opacity="0.7"/>
    <!-- Top accent — terminal cursor blink -->
    <rect x="240" y="90" width="32" height="32" rx="4" fill="url(#grad)" stroke="none" opacity="0.85"/>
  </g>
  
  <!-- Subtle dot network (learning nodes) -->
  <g fill="url(#grad)" opacity="0.3">
    <circle cx="100" cy="420" r="6"/>
    <circle cx="160" cy="440" r="4"/>
    <circle cx="352" cy="440" r="4"/>
    <circle cx="412" cy="420" r="6"/>
    <circle cx="256" cy="460" r="5"/>
  </g>
  <g stroke="url(#grad)" stroke-width="1.5" opacity="0.15">
    <line x1="100" y1="420" x2="160" y2="440"/>
    <line x1="160" y1="440" x2="256" y2="460"/>
    <line x1="256" y1="460" x2="352" y2="440"/>
    <line x1="352" y1="440" x2="412" y2="420"/>
  </g>
</svg>
